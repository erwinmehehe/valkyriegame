name: Inline native render review
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write

jobs:
  publish-inline-native-render:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Create small inline render
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/native-render/pr65-native-contact-sheet.jpg
          sips -z 576 1024 docs/native-render/pr65-native-contact-sheet.jpg \
            --out docs/native-render/pr65-native-contact-sheet-inline.jpg >/dev/null
          base64 -i docs/native-render/pr65-native-contact-sheet-inline.jpg \
            | tr -d '\n' > docs/native-render/pr65-native-contact-sheet-inline.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/native-render/pr65-native-contact-sheet-inline.jpg \
            docs/native-render/pr65-native-contact-sheet-inline.b64
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: publish inline native render [skip ci]"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
