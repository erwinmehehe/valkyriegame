name: Native foundation
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: native-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  learning-core:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test -j 2

  native-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical Valkyrie identity
        run: python3 scripts/verify_valkyrie_identity.py
      - name: Test Valkyrie identity guard
        run: python3 -m unittest discover -s scripts -p 'test_verify_valkyrie_identity.py'
      - name: Reject character changes in unrelated PRs
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git diff --name-only --no-renames FETCH_HEAD HEAD | python3 scripts/verify_valkyrie_identity.py --changed-stdin
      - run: python3 scripts/validate_native.py
      - name: Verify 76-skill teacher review index
        run: python3 scripts/verify_math_teacher_matrix.py
      - name: Test teacher review index guard
        run: python3 -m unittest discover -s scripts -p 'test_verify_math_teacher_matrix.py'
      - name: Export unapproved 76-skill teacher worksheet
        run: python3 scripts/verify_math_teacher_matrix.py --export-csv math-teacher-review-unapproved.csv
      - uses: actions/upload-artifact@v4
        with:
          name: math-76-skill-review-unapproved
          path: math-teacher-review-unapproved.csv
          if-no-files-found: error
      - name: Reject missing native SpriteKit image references
        run: python3 scripts/verify_spritekit_assets.py
      - name: Test image reference scanner
        run: python3 -m unittest discover -s scripts -p 'test_verify_spritekit_assets.py'

  ipad-build-and-tests:
    needs:
      - learning-core
      - native-validation
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: iPad Simulator unit tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((x["udid"] for devices in d["devices"].values() for x in devices if x["name"] == "iPad (9th generation)"), ""))')
          if [ -z "$simulator_id" ]; then
            device_type=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["identifier"] for x in d["devicetypes"] if x["name"] == "iPad (9th generation)"))')
            runtime=$(xcrun simctl list runtimes available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); ios=[x for x in d["runtimes"] if x["platform"] == "iOS"]; ios.sort(key=lambda x: tuple(map(int, x["version"].split("."))), reverse=True); print(ios[0]["identifier"])')
            simulator_id=$(xcrun simctl create "Valkyrie iPad 9th generation" "$device_type" "$runtime")
          fi
          echo "Using iPad (9th generation): $simulator_id"
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id" 2>/dev/null || true
          xcrun simctl bootstatus "$simulator_id" -b
          xcodebuild test -project ValkyrieLearn.xcodeproj -scheme ValkyrieLearn \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -resultBundlePath NativeTests.xcresult CODE_SIGNING_ALLOWED=NO

      - name: Build browser-streamable iOS Simulator app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build -project ValkyrieLearn.xcodeproj -scheme ValkyrieLearn \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath NativeSimulatorBuild \
            CODE_SIGNING_ALLOWED=NO
          app_path=$(find NativeSimulatorBuild/Build/Products -maxdepth 2 -type d -name "ValkyrieLearn.app" | head -n 1)
          if [ -z "$app_path" ]; then
            echo "ValkyrieLearn.app was not produced"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app_path" ValkyrieLearn-simulator.zip
      - name: Export native scene screenshots
        if: ${{ always() && !cancelled() }}
        run: |
          if [ -d NativeTests.xcresult ]; then
            xcrun xcresulttool export attachments --path NativeTests.xcresult --output-path native-scene-review
          fi
          python3 scripts/collect_scene_files.py
      - name: Create compact scene previews
        if: ${{ always() && !cancelled() }}
        run: python3 scripts/create_scene_previews.py
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !cancelled() }}
        with:
          name: native-scene-preview
          path: native-scene-preview
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !cancelled() }}
        with:
          name: native-scene-review
          path: native-scene-review
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: valkyrie-native-simulator-app
          path: ValkyrieLearn-simulator.zip
          if-no-files-found: error
